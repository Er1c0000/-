<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 标题 -->
  <text x="500" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">
    框架核心思想：优势互补，先分离后剖析
  </text>
  
  <!-- 框1: 原始TIE序列 -->
  <rect x="80" y="80" width="160" height="80" rx="10" fill="#4A90E2" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
  <text x="160" y="115" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    原始TIE序列
  </text>
  <text x="160" y="140" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    (RJ + DJ)
  </text>
  
  <!-- 箭头1 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
  <line x1="240" y1="120" x2="290" y2="120" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 框2: 第一阶段 -->
  <rect x="290" y="70" width="220" height="100" rx="10" fill="#FFFBF0" stroke="#666" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">
    第一阶段：统计预处理
  </text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#555" text-anchor="middle">
    高斯混合模型（GMM）
  </text>
  
  <!-- 输出RJ标签 -->
  <rect x="520" y="95" width="80" height="50" rx="8" fill="#F5F5F5" stroke="#666" stroke-width="2"/>
  <text x="560" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">
    输出
  </text>
  <text x="560" y="135" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#555" text-anchor="middle">
    RJ
  </text>
  
  <!-- 箭头2 向下 -->
  <line x1="400" y1="170" x2="400" y2="220" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 框3: 剩余DJ序列 -->
  <rect x="310" y="220" width="180" height="80" rx="10" fill="#7CB9E8" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="255" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    剩余DJ序列
  </text>
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    (确定性抖动)
  </text>
  
  <!-- 箭头3 向下 -->
  <line x1="400" y1="300" x2="400" y2="350" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 框4: 第二阶段 -->
  <rect x="280" y="350" width="240" height="100" rx="10" fill="#F8F8F8" stroke="#666" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333" text-anchor="middle">
    第二阶段：时频精细分析
  </text>
  <text x="400" y="415" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#555" text-anchor="middle">
    小波变换
  </text>
  
  <!-- 箭头4 向下 -->
  <line x1="400" y1="450" x2="400" y2="500" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 框5: DJ的时频谱 -->
  <rect x="310" y="500" width="180" height="70" rx="10" fill="#6B9BD1" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
  <text x="400" y="530" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">
    DJ的时频谱
  </text>
  <text x="400" y="552" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    (精细特征)
  </text>
  
  <!-- 箭头5 向右 -->
  <line x1="490" y1="535" x2="560" y2="535" stroke="#333" stroke-width="3" marker-end="url(#arrowhead)"/>
  
  <!-- 框6: 全面的抖动分量 -->
  <rect x="560" y="495" width="180" height="80" rx="10" fill="#5A7A9A" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
  <text x="650" y="525" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">
    全面的抖动分量
  </text>
  <text x="650" y="550" font-family="Arial, sans-serif" font-size="14" fill="white" text-anchor="middle">
    RJ + DJ分解结果
  </text>
  
  <!-- 框架优势说明框 -->
  <rect x="630" y="200" width="340" height="220" rx="10" fill="#F5F5F5" stroke="#607D8B" stroke-width="2" filter="url(#shadow)"/>
  <text x="800" y="230" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#37474F" text-anchor="middle">
    框架优势
  </text>
  
  <!-- 优势1 -->
  <circle cx="655" cy="265" r="8" fill="#666"/>
  <text x="675" y="270" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    第一阶段优势
  </text>
  <text x="655" y="290" font-family="Arial, sans-serif" font-size="12" fill="#555">
    使用更鲁棒的统计模型(GMM)
  </text>
  <text x="655" y="308" font-family="Arial, sans-serif" font-size="12" fill="#555">
    精确分离背景随机噪声(RJ)
  </text>
  
  <!-- 优势2 -->
  <circle cx="655" cy="340" r="8" fill="#666"/>
  <text x="675" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">
    第二阶段优势
  </text>
  <text x="655" y="365" font-family="Arial, sans-serif" font-size="12" fill="#555">
    针对去噪后的确定性抖动(DJ)
  </text>
  <text x="655" y="383" font-family="Arial, sans-serif" font-size="12" fill="#555">
    采用先进的时频分析工具小波变换
  </text>
  <text x="655" y="401" font-family="Arial, sans-serif" font-size="12" fill="#555">
    进行精细刻画
  </text>
  
  <!-- 装饰性连接线 -->
  <line x1="520" y1="120" x2="630" y2="260" stroke="#999" stroke-width="2" stroke-dasharray="5,5" opacity="0.4"/>
  <line x1="520" y1="535" x2="630" y2="360" stroke="#999" stroke-width="2" stroke-dasharray="5,5" opacity="0.4"/>
  
  <!-- 阶段标识 -->
  <rect x="20" y="100" width="40" height="100" rx="5" fill="#CCC" opacity="0.3"/>
  <text x="40" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle" transform="rotate(-90 40 155)">
    阶段一
  </text>
  
  <rect x="20" y="360" width="40" height="100" rx="5" fill="#AAA" opacity="0.3"/>
  <text x="40" y="415" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#555" text-anchor="middle" transform="rotate(-90 40 415)">
    阶段二
  </text>
</svg>