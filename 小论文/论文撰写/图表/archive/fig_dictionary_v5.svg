<svg width="100%" viewBox="0 0 440 285" xmlns="http://www.w3.org/2000/svg"
     style="font-family:'DejaVu Serif',serif; background:white;">

<!--
  Brace labels (text bottom):  y≈13
  Brace lines:                 y=22
  Matrix top:                  y=26
  Matrix bottom:               y=234  (height=208)
  N brace:                     y=26..234
  Legend inside H_PJ:          y=214..222
  M brace:                     y=244
  Bottom text:                 y=257, y=272
-->

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5"
          markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
          stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- ── brace labels (text sits above line with clear gap) ── -->
<text x="110" y="13" text-anchor="middle" dominant-baseline="auto"
