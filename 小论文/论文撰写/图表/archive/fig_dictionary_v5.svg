  <tspan font-style="italic">H</tspan><tspan baseline-shift="sub" font-size="8">PJ</tspan>,  2K cols
</text>
<line x1="10"  y1="22" x2="210" y2="22" stroke="#185FA5" stroke-width="0.8"
